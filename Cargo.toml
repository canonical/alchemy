[package]
name = "alchemy"
version = "0.1.0"
edition = "2021"
description = "A cross-platform CI/CD AI agent"

[[bin]]
name = "alchemy"
path = "src/main.rs"

[dependencies]
# Core
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "io-util", "io-std", "net", "macros", "fs", "sync", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures = "0.3"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# RAG
rusqlite = { version = "0.32", features = ["bundled"] }

# Eventsource for SSE streaming
eventsource-stream = "0.2"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
