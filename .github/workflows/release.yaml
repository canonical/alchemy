name: release

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release for the current ref
        type: boolean
        required: false
        default: false
      tag_name:
        description: Release tag to use when publishing manually
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_suffix: ""
            use_cross: false
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_suffix: ""
            use_cross: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_suffix: .exe
            use_cross: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary_suffix: ""
            use_cross: false
          - runner: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            binary_suffix: ""
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import shutil
          import tarfile
          import zipfile

          target = os.environ["TARGET"]
          archive_ext = os.environ["ARCHIVE_EXT"]
          binary_suffix = os.environ["BINARY_SUFFIX"]
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          dist = root / "dist"
          dist.mkdir(exist_ok=True)

          binary_name = f"alchemy{binary_suffix}"
          built_binary = root / "target" / target / "release" / binary_name
          if not built_binary.exists():
              raise SystemExit(f"missing built binary: {built_binary}")

          package_root = dist / f"alchemy-{target}"
          if package_root.exists():
              shutil.rmtree(package_root)
          package_root.mkdir(parents=True)
          packaged_binary = package_root / binary_name
          shutil.copy2(built_binary, packaged_binary)

          archive = dist / f"alchemy-{target}.{archive_ext}"
          if archive_ext == "zip":
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  zf.write(packaged_binary, arcname=f"{package_root.name}/{binary_name}")
          else:
              with tarfile.open(archive, "w:gz") as tf:
                  tf.add(package_root, arcname=package_root.name)

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (dist / f"{archive.name}.sha256").write_text(f"{digest}  {archive.name}\n")
          PY
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/alchemy-${{ matrix.target }}.${{ matrix.archive_ext }}
            dist/alchemy-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  package-macos-universal-pkg:
    name: Package macOS universal pkg
    runs-on: macos-latest
    needs: build

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*apple-darwin"

      - name: Build universal binary and pkg
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          arm_archive="dist/aarch64-apple-darwin/alchemy-aarch64-apple-darwin.tar.gz"
          x64_archive="dist/x86_64-apple-darwin/alchemy-x86_64-apple-darwin.tar.gz"

          tar -xzf "$arm_archive" -C "$work"
          tar -xzf "$x64_archive" -C "$work"

          arm_bin="$work/alchemy-aarch64-apple-darwin/alchemy"
          x64_bin="$work/alchemy-x86_64-apple-darwin/alchemy"
          universal_dir="$work/universal/usr/local/bin"
          mkdir -p "$universal_dir"

          lipo -create -output "$universal_dir/alchemy" "$arm_bin" "$x64_bin"
          chmod 0755 "$universal_dir/alchemy"

          out="dist/alchemy-universal-macos.pkg"
          pkgbuild --root "$work/universal" --identifier "io.github.canonical.alchemy" --install-location "/" "$out"
          shasum -a 256 "$out" > "${out}.sha256"

      - name: Upload universal macOS pkg
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-pkg
          path: |
            dist/alchemy-universal-macos.pkg
            dist/alchemy-universal-macos.pkg.sha256
          if-no-files-found: error

  package-windows-installer:
    name: Package Windows installer exe
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          name: x86_64-pc-windows-msvc

      - name: Extract packaged binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Expand-Archive -Path "dist/alchemy-x86_64-pc-windows-msvc.zip" -DestinationPath "build" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer exe
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppId={{D8A3704D-22A4-4BD0-8B72-2B58D3B95D98}
          AppName=Alchemy
          AppVersion=0.1.0
          DefaultDirName={autopf}\Alchemy
          DefaultGroupName=Alchemy
          OutputDir=.
          OutputBaseFilename=alchemy-installer-windows-x64
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "..\build\alchemy-x86_64-pc-windows-msvc\alchemy.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Alchemy"; Filename: "{app}\alchemy.exe"
          Name: "{group}\Uninstall Alchemy"; Filename: "{uninstallexe}"

          [Tasks]
          Name: "addtopath"; Description: "Add Alchemy to user PATH"; GroupDescription: "Additional tasks:"; Flags: unchecked

          [Registry]
          Root: HKCU; Subkey: "Environment"; ValueType: expandsz; ValueName: "Path"; ValueData: "{olddata};{app}"; Tasks: addtopath; Check: NeedsAddPath(ExpandConstant('{app}'))

          [Code]
          function NeedsAddPath(Param: string): boolean;
          var
            OrigPath: string;
          begin
            if not RegQueryStringValue(HKEY_CURRENT_USER, 'Environment', 'Path', OrigPath) then
            begin
              Result := True;
              exit;
            end;
            Result := Pos(';' + Uppercase(Param) + ';', ';' + Uppercase(OrigPath) + ';') = 0;
          end;
          "@
          Set-Content -Path "dist\alchemy-installer.iss" -Value $iss -Encoding Ascii
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "dist\alchemy-installer.iss"
          Get-FileHash "dist\alchemy-installer-windows-x64.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  alchemy-installer-windows-x64.exe" } | Set-Content "dist\alchemy-installer-windows-x64.exe.sha256"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-exe
          path: |
            dist/alchemy-installer-windows-x64.exe
            dist/alchemy-installer-windows-x64.exe.sha256
          if-no-files-found: error

  package-linux-deb:
    name: Package Linux .deb
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install deb tools
        run: |
         sudo apt-get update
         sudo apt-get install -y dpkg dpkg-dev

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
         path: dist
         pattern: "*-unknown-linux-gnu"

      - name: Extract binaries
        shell: bash
        run: |
         set -euo pipefail
         mkdir -p build

         for archive in dist/*/alchemy-*.tar.gz; do
           tar -xzf "$archive" -C build
         done

      - name: Get version
        id: version
        shell: bash
        run: |
         version=$(grep "^version" Cargo.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
         echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve package filename version
        id: filename_version
        shell: bash
        run: |
         set -euo pipefail
         if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.tag_name }}" = "latest" ]; then
           filename_version="latest"
         elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
           filename_version="latest"
         else
           filename_version="${{ steps.version.outputs.version }}"
         fi
         echo "filename_version=$filename_version" >> "$GITHUB_OUTPUT"

      - name: Build deb packages
        shell: bash
        run: |
         set -euo pipefail
         mkdir -p dist/deb
         chmod +x scripts/build-deb.sh

         # Build for x86_64
         ./scripts/build-deb.sh \
           "x86_64-unknown-linux-gnu" \
           "build/alchemy-x86_64-unknown-linux-gnu/alchemy" \
           "${{ steps.version.outputs.version }}" \
           "dist/deb" \
           "${{ steps.filename_version.outputs.filename_version }}"

         # Build for aarch64
         ./scripts/build-deb.sh \
           "aarch64-unknown-linux-gnu" \
           "build/alchemy-aarch64-unknown-linux-gnu/alchemy" \
           "${{ steps.version.outputs.version }}" \
           "dist/deb" \
           "${{ steps.filename_version.outputs.filename_version }}"

      - name: Upload deb packages
        uses: actions/upload-artifact@v4
        with:
         name: linux-deb-packages
         path: |
           dist/deb/*.deb
           dist/deb/*.sha256
         if-no-files-found: error

  package-linux-rpm:
    name: Package Linux .rpm
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install rpm tools
        run: |
         sudo apt-get update
         sudo apt-get install -y rpm

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
         path: dist
         pattern: "*-unknown-linux-gnu"

      - name: Extract binaries
        shell: bash
        run: |
         set -euo pipefail
         mkdir -p build

         for archive in dist/*/alchemy-*.tar.gz; do
           tar -xzf "$archive" -C build
         done

      - name: Get version
        id: version
        shell: bash
        run: |
         version=$(grep "^version" Cargo.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
         echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve package filename version
        id: filename_version
        shell: bash
        run: |
         set -euo pipefail
         if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.tag_name }}" = "latest" ]; then
           filename_version="latest"
         elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
           filename_version="latest"
         else
           filename_version="${{ steps.version.outputs.version }}"
         fi
         echo "filename_version=$filename_version" >> "$GITHUB_OUTPUT"

      - name: Build rpm packages
        shell: bash
        run: |
         set -euo pipefail
         mkdir -p dist/rpm
         chmod +x scripts/build-rpm.sh

         # Build for x86_64
         ./scripts/build-rpm.sh \
           "x86_64-unknown-linux-gnu" \
           "build/alchemy-x86_64-unknown-linux-gnu/alchemy" \
           "${{ steps.version.outputs.version }}" \
           "dist/rpm" \
           "${{ steps.filename_version.outputs.filename_version }}"

         # Build for aarch64
         ./scripts/build-rpm.sh \
           "aarch64-unknown-linux-gnu" \
           "build/alchemy-aarch64-unknown-linux-gnu/alchemy" \
           "${{ steps.version.outputs.version }}" \
           "dist/rpm" \
           "${{ steps.filename_version.outputs.filename_version }}"

      - name: Upload rpm packages
        uses: actions/upload-artifact@v4
        with:
         name: linux-rpm-packages
         path: |
           dist/rpm/*.rpm
           dist/rpm/*.sha256
         if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - build
      - package-macos-universal-pkg
      - package-windows-installer
      - package-linux-deb
      - package-linux-rpm
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ inputs.tag_name }}" ]; then
              echo "tag_name is required when publish_release is true" >&2
              exit 1
            fi
            tag_name="${{ inputs.tag_name }}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tag_name="latest"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name == 'latest' && 'latest (main)' || steps.tag.outputs.tag_name }}
          generate_release_notes: ${{ steps.tag.outputs.tag_name != 'latest' }}
          body: ${{ steps.tag.outputs.tag_name == 'latest' && 'Automated rolling release from main.' || '' }}
          make_latest: ${{ steps.tag.outputs.tag_name == 'latest' && 'true' || 'legacy' }}
          overwrite_files: true
          files: dist/**/*
