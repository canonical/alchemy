name: release

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release for the current ref
        type: boolean
        required: false
        default: false
      tag_name:
        description: Release tag to use when publishing manually
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_suffix: ""
            use_cross: false
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_suffix: ""
            use_cross: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_suffix: .exe
            use_cross: false
          - runner: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary_suffix: ""
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import shutil
          import tarfile
          import zipfile

          target = os.environ["TARGET"]
          archive_ext = os.environ["ARCHIVE_EXT"]
          binary_suffix = os.environ["BINARY_SUFFIX"]
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          dist = root / "dist"
          dist.mkdir(exist_ok=True)

          binary_name = f"alchemy{binary_suffix}"
          built_binary = root / "target" / target / "release" / binary_name
          if not built_binary.exists():
              raise SystemExit(f"missing built binary: {built_binary}")

          package_root = dist / f"alchemy-{target}"
          if package_root.exists():
              shutil.rmtree(package_root)
          package_root.mkdir(parents=True)
          packaged_binary = package_root / binary_name
          shutil.copy2(built_binary, packaged_binary)

          archive = dist / f"alchemy-{target}.{archive_ext}"
          if archive_ext == "zip":
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  zf.write(packaged_binary, arcname=f"{package_root.name}/{binary_name}")
          else:
              with tarfile.open(archive, "w:gz") as tf:
                  tf.add(package_root, arcname=package_root.name)

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (dist / f"{archive.name}.sha256").write_text(f"{digest}  {archive.name}\n")
          PY
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/alchemy-${{ matrix.target }}.${{ matrix.archive_ext }}
            dist/alchemy-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ inputs.tag_name }}" ]; then
              echo "tag_name is required when publish_release is true" >&2
              exit 1
            fi
            tag_name="${{ inputs.tag_name }}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tag_name="latest"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name == 'latest' && 'latest (main)' || steps.tag.outputs.tag_name }}
          generate_release_notes: ${{ steps.tag.outputs.tag_name != 'latest' }}
          body: ${{ steps.tag.outputs.tag_name == 'latest' && 'Automated rolling release from main.' || '' }}
          make_latest: ${{ steps.tag.outputs.tag_name == 'latest' && 'true' || 'legacy' }}
          overwrite_files: true
          files: dist/**/*
